<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14161b">
  <title>Kaiju Rampage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="stick"><div class="knob"></div></div>

    <div id="hud" class="hidden">
      <div class="top">
        <div class="bars">
          <div id="hp" class="bar"><div class="fill"></div><div class="shield"></div><span></span></div>
          <div id="growth" class="bar"><div class="fill"></div><span></span></div>
        </div>
        <div class="meta">
          <div class="pill"><i class="scrap-icon"></i><span id="scrap">0</span></div>
          <div class="pill" id="timer">0:00</div>
          <button id="pauseBtn" class="icon-btn" aria-label="Pause">II</button>
        </div>
      </div>
      <div id="bossbar" class="hidden"><span></span><div class="track"><div class="fill"></div></div></div>
      <div id="banner" class="banner"></div>
      <div id="hint"></div>
      <div id="augbar"></div>
    </div>

    <div id="pick" class="modal hidden"></div>
    <div id="revive" class="modal hidden"></div>
    <div id="pause" class="modal hidden"></div>
    <div id="results" class="modal hidden"></div>
    <div id="menu" class="modal hidden"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
