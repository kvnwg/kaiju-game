<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14161b">
  <title>Kaiju Rampage</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
  <!-- CrazyGames SDK v3: real ads and gameplay events on CrazyGames; the game runs without it elsewhere. -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="floaters"></div>
    <div id="screenFlash"></div>
    <div id="stick"><div class="knob"></div></div>
    <button id="dashBtn" class="dash-btn hidden" aria-label="Charge"><i></i><b>Charge</b><small>Space</small></button>

    <div id="hud" class="hidden">
      <div id="xpbar"><div class="fill"></div><span></span></div>
      <div class="top">
        <div class="vitals">
          <div id="stageBadge" class="badge"><small>LV</small><b>1</b></div>
          <div class="bars">
            <div id="hp" class="bar"><div class="fill"></div><div class="shield"></div><i class="heart"></i><span></span></div>
            <div id="growth" class="bar"><div class="fill"></div><span></span><em></em></div>
            <div id="threat" class="threat"><small>Threat</small><span class="pips"><i></i><i></i><i></i><i></i><i></i></span><em></em></div>
            <div id="objective" class="objective"><b>Bonus</b><span></span></div>
            <div id="trait" class="trait hidden"><b></b><span class="track"><i></i></span></div>
          </div>
        </div>
        <div class="meta">
          <div class="meta-row">
            <div class="pill damage-pill"><i class="ic ic-cash"></i><span id="scrap">$0</span></div>
            <button id="soundBtn" class="icon-btn sound-btn" aria-label="Sound on or off">Sound</button>
            <button id="pauseBtn" class="icon-btn" aria-label="Pause">II</button>
          </div>
          <div class="pill small" id="timer">0:00</div>
          <div id="combo" class="combo"><b>x0</b><small>combo</small><i></i></div>
        </div>
      </div>
      <div id="bossbar" class="hidden"><span></span><div class="track"><div class="fill"></div></div><em class="quip"></em></div>
      <div id="banner" class="banner"></div>
      <div id="callout" class="callout"></div>
      <div id="sizeUp" class="size-up"></div>
      <div id="preyArrow" class="hidden"><span></span><b></b></div>
      <div id="hint"><b>TIP</b><span></span></div>
      <div id="augbar"></div>
    </div>

    <div id="pick" class="modal hidden"></div>
    <div id="revive" class="modal hidden"></div>
    <div id="pause" class="modal hidden"></div>
    <div id="results" class="modal hidden"></div>
    <div id="menu" class="modal hidden"></div>
    <div id="warp" class="warp hidden"><canvas></canvas><div class="warp-text"></div><div class="warp-card"></div></div>
    <div id="news" class="news hidden"></div>
    <div id="loading" class="modal"><div class="loading-card"><div class="logo">Kaiju Rampage</div><p class="muted">Building Harbor Town…</p></div></div>
  </div>
  <script src="vendor/three/three.min.js"></script>
  <script src="vendor/three/CopyShader.js"></script>
  <script src="vendor/three/LuminosityHighPassShader.js"></script>
  <script src="vendor/three/Pass.js"></script>
  <script src="vendor/three/MaskPass.js"></script>
  <script src="vendor/three/EffectComposer.js"></script>
  <script src="vendor/three/RenderPass.js"></script>
  <script src="vendor/three/ShaderPass.js"></script>
  <script src="vendor/three/UnrealBloomPass.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
