<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14161b">
  <title>Kaiju Rampage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="floaters"></div>
    <div id="screenFlash"></div>
    <div id="stick"><div class="knob"></div></div>
    <button id="dashBtn" class="dash-btn hidden" aria-label="Charge"><i></i><b>Charge</b><small>Space</small></button>

    <div id="hud" class="hidden">
      <div id="xpbar"><div class="fill"></div><span></span></div>
      <div class="top">
        <div class="vitals">
          <div id="stageBadge" class="badge"><small>LV</small><b>1</b></div>
          <div class="bars">
            <div id="hp" class="bar"><div class="fill"></div><div class="shield"></div><i class="heart"></i><span></span></div>
            <div id="growth" class="bar"><div class="fill"></div><span></span><em></em></div>
            <div id="threat" class="threat"><small>Threat</small><span class="pips"><i></i><i></i><i></i><i></i><i></i></span><em></em></div>
          </div>
        </div>
        <div class="meta">
          <div class="meta-row">
            <div class="pill"><i class="scrap-icon"></i><span id="scrap">0</span></div>
            <button id="pauseBtn" class="icon-btn" aria-label="Pause">II</button>
          </div>
          <div class="pill small" id="timer">0:00</div>
          <div id="combo" class="combo"><b>x0</b><small>combo</small><i></i></div>
        </div>
      </div>
      <div id="bossbar" class="hidden"><span></span><div class="track"><div class="fill"></div></div></div>
      <div id="banner" class="banner"></div>
      <div id="callout" class="callout"></div>
      <div id="preyArrow" class="hidden"><span></span></div>
      <div id="hint"><b>TIP</b><span></span></div>
      <div id="augbar"></div>
    </div>

    <div id="pick" class="modal hidden"></div>
    <div id="revive" class="modal hidden"></div>
    <div id="pause" class="modal hidden"></div>
    <div id="results" class="modal hidden"></div>
    <div id="menu" class="modal hidden"></div>
    <div id="loading" class="modal"><div class="loading-card"><div class="logo">Kaiju Rampage</div><p class="muted">Building Harbor Town…</p></div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/Pass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/MaskPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
