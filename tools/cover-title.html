<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'BlackOps'; src: url(fonts/black-ops-one.woff2) format('woff2'); }
  html, body { margin: 0; background: #404e69; }
  canvas { display: block; }
</style>
<canvas id="c"></canvas>
<script>
// Covers for CrazyGames: the owner's pixel-art painting (store/art/kaiju-rampage.png) with the title
// lettered over it in the same chunky pixels, in Black Ops One (OFL, tools/fonts). Rendered by
// tools/cover-art.mjs. ?shot=tall|square|wide&w=&h=
const q = new URLSearchParams(location.search);
const W = Number(q.get('w') || 800);
const H = Number(q.get('h') || 1200);
const SHOT = q.get('shot') || 'tall';
const FONT = 'BlackOps';
const NAVY = '#404e69';

let seed = 1234;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

function load(src) {
  return new Promise((ok, bad) => {
    const i = new Image();
    i.onload = () => ok(i);
    i.onerror = bad;
    i.src = src;
  });
}

// The title, lettered at `px` screen pixels per art pixel: dark steel with a hard black outline and
// drop shadow, an atomic-blue rim along every top edge and a few glowing cracks, warmed by fire at
// the bottom. Returns a canvas the size of the cover with the lettering placed in box
// {x, y, w, h} (cover pixels), each line scaled evenly to fit the box and centred.
function lettering(lines, box, px, font) {
  const lw = Math.ceil(box.w / px);
  const lh = Math.ceil(box.h / px);
  const pad = 4;
  const sw = lw + pad * 2;
  const sh = lh + pad * 2;
  // 1. The letter shapes, in low-res pixels: each line fills the width, heights by its weight.
  const mask = document.createElement('canvas');
  mask.width = sw;
  mask.height = sh;
  const m = mask.getContext('2d');
  const total = lines.reduce((s, l) => s + l.weight, 0);
  const gap = Math.max(1, Math.round(lh * 0.05));
  let y = pad;
  for (const l of lines) {
    const hh = Math.round(((lh - gap * (lines.length - 1)) * l.weight) / total);
    // Measure at a big size, then scale to fill this line's box exactly.
    m.font = `100px ${font}`;
    const met = m.measureText(l.text);
    const asc = met.actualBoundingBoxAscent;
    const desc = met.actualBoundingBoxDescent;
    const tw = met.actualBoundingBoxLeft + met.actualBoundingBoxRight;
    // Same proportions as the font: as wide as the box allows, no taller than the line's share.
    const k = Math.min(lw / tw, hh / (asc + desc));
    const th = (asc + desc) * k;
    const ox = pad + (lw - tw * k) / 2;
    m.save();
    m.translate(ox, y);
    m.scale(k, k);
    m.fillStyle = '#fff';
    m.fillText(l.text, met.actualBoundingBoxLeft, asc);
    m.restore();
    l.y0 = y;
    l.y1 = y + th;
    y += th + gap;
  }
  const md = m.getImageData(0, 0, sw, sh).data;
  const on = (x, yy) => x >= 0 && yy >= 0 && x < sw && yy < sh && md[(yy * sw + x) * 4 + 3] > 120;
  // 2. Paint the pixels.
  const out = document.createElement('canvas');
  out.width = sw;
  out.height = sh;
  const o = out.getContext('2d');
  const img = o.createImageData(sw, sh);
  const d = img.data;
  const put = (x, yy, c, a = 255) => {
    const i = (yy * sw + x) * 4;
    d[i] = c[0];
    d[i + 1] = c[1];
    d[i + 2] = c[2];
    d[i + 3] = a;
  };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  // Charcoal stone, lit cold from above and by the burning city from below.
  const STEEL = ['#a9adb8', '#8d919e', '#737785', '#5d606d', '#4a4c58', '#3a3c47', '#2c2d37'].map(hex);
  const INK = hex('#0b0c12');
  const SHADOW = hex('#15161f');
  const RIM = hex('#c9d4e2');
  const RIM2 = hex('#8fa0b8');
  const GLOW = hex('#8fd6ff');
  const GLOW2 = hex('#4fa8e8');
  const EMBER = hex('#d9602c');
  const lineOf = (yy) => lines.find((l) => yy >= l.y0 - 1 && yy <= l.y1 + 1) || lines[0];
  // Cracks: a few jagged paths down through each line, glowing blue like the kaiju's spines.
  const crack = new Set();
  for (const l of lines) {
    const n = Math.max(2, Math.round(lw / 40));
    for (let k = 0; k < n; k++) {
      let cx = pad + Math.floor(rnd() * lw);
      for (let yy = l.y0; yy < l.y1; yy++) {
        if (rnd() < 0.45) cx += rnd() < 0.5 ? -1 : 1;
        if (rnd() < 0.82) crack.add(yy * sw + cx);
      }
    }
  }
  for (let yy = 0; yy < sh; yy++) {
    for (let x = 0; x < sw; x++) {
      if (on(x, yy)) {
        const l = lineOf(yy);
        const f = Math.max(0, Math.min(0.999, (yy - l.y0) / Math.max(1, l.y1 - l.y0)));
        let c = STEEL[Math.floor(f * STEEL.length)].slice();
        // grit
        const r = rnd();
        if (r < 0.08) c = c.map((v) => v * 0.8);
        else if (r > 0.95) c = c.map((v) => Math.min(255, v * 1.12));
        // fire light from below
        if (f > 0.55) {
          const t = ((f - 0.55) / 0.45) * 0.6;
          c = c.map((v, i) => v * (1 - t) + EMBER[i] * t);
        }
        if (!on(x, yy - 1)) c = RIM; // a cold rim on every top edge
        else if (!on(x, yy - 2)) c = c.map((v, i) => (v + RIM2[i]) / 2);
        if (!on(x, yy + 1)) c = c.map((v, i) => (v + EMBER[i] * 1.2) / 2); // fire-lit undersides
        // atomic cracks glowing through the stone
        if (crack.has(yy * sw + x) && on(x, yy - 1) && on(x, yy + 1) && on(x - 1, yy) && on(x + 1, yy)) c = rnd() < 0.55 ? GLOW : GLOW2;
        // chipped edges: the odd outline pixel bitten away
        const edge = !on(x - 1, yy) || !on(x + 1, yy) || !on(x, yy + 1);
        if (edge && rnd() < 0.07) {
          put(x, yy, INK);
          continue;
        }
        put(x, yy, c);
      } else if (on(x - 1, yy - 2) || on(x, yy - 2) || on(x - 1, yy - 1)) put(x, yy, SHADOW); // drop shadow
      else {
        // outline
        let near = false;
        for (let dy = -1; dy <= 1 && !near; dy++) for (let dx = -1; dx <= 1 && !near; dx++) if (on(x + dx, yy + dy)) near = true;
        if (near) put(x, yy, INK);
      }
    }
  }
  o.putImageData(img, 0, 0);
  // 3. Up to cover size, crisp, with an atomic glow behind and embers warming it from below.
  const full = document.createElement('canvas');
  full.width = W;
  full.height = H;
  const g = full.getContext('2d');
  g.imageSmoothingEnabled = false;
  const X = box.x - pad * px;
  const Y = box.y - pad * px;
  g.save();
  g.shadowColor = 'rgba(95, 170, 235, 0.55)';
  g.shadowBlur = px * 8;
  g.drawImage(out, X, Y, sw * px, sh * px);
  g.shadowColor = 'rgba(230, 100, 40, 0.5)';
  g.shadowBlur = px * 10;
  g.shadowOffsetY = px * 5;
  g.drawImage(out, X, Y, sw * px, sh * px);
  g.restore();
  g.drawImage(out, X, Y, sw * px, sh * px);
  return full;
}

// Pixel smoke and embers for empty space (the wide cover's left side): soft value-noise clouds in
// the painting's navy greys, lighter and warmer towards the burning bottom, with drifting embers.
function smoke(ctx, x0, y0, w, h, px) {
  const gw = Math.ceil(w / px);
  const gh = Math.ceil(h / px);
  const lat = new Map();
  const at = (i, j, o) => {
    const k = `${i},${j},${o}`;
    if (!lat.has(k)) lat.set(k, rnd());
    return lat.get(k);
  };
  const vnoise = (x, y, o) => {
    const i = Math.floor(x);
    const j = Math.floor(y);
    const fx = x - i;
    const fy = y - j;
    const sx = fx * fx * (3 - 2 * fx);
    const sy = fy * fy * (3 - 2 * fy);
    const a = at(i, j, o) + (at(i + 1, j, o) - at(i, j, o)) * sx;
    const b = at(i, j + 1, o) + (at(i + 1, j + 1, o) - at(i, j + 1, o)) * sx;
    return a + (b - a) * sy;
  };
  const fbm = (x, y) => vnoise(x, y, 0) * 0.55 + vnoise(x * 2.1, y * 2.1, 1) * 0.3 + vnoise(x * 4.3, y * 4.3, 2) * 0.15;
  const shades = ['#404e69', '#465470', '#4e5a75', '#58637c', '#646c84'];
  for (let j = 0; j < gh; j++) {
    for (let i = 0; i < gw; i++) {
      const n = fbm(i / 22, j / 11 + i / 90);
      const lift = (j / gh) * 0.18; // denser, paler smoke low down
      const v = n + lift - 0.42;
      if (v <= 0) continue;
      const k = Math.min(shades.length - 1, 1 + Math.floor(v * 9));
      ctx.fillStyle = shades[k];
      ctx.fillRect(x0 + i * px, y0 + j * px, px, px);
    }
  }
  // The city burning off-frame: a dull red glow along the bottom.
  const g = ctx.createLinearGradient(0, y0 + h * 0.62, 0, y0 + h);
  g.addColorStop(0, 'rgba(200, 80, 40, 0)');
  g.addColorStop(1, 'rgba(200, 80, 40, 0.38)');
  ctx.fillStyle = g;
  ctx.fillRect(x0, y0 + h * 0.62, w, h * 0.38);
  for (let i = 0; i < 90; i++) {
    const bx = Math.round((x0 + rnd() * w) / px) * px;
    const by = Math.round((y0 + h * (0.35 + rnd() * 0.65)) / px) * px;
    ctx.fillStyle = rnd() < 0.6 ? '#ff9a4a' : '#ffd27a';
    ctx.globalAlpha = 0.45 + rnd() * 0.55;
    ctx.fillRect(bx, by, px, px);
  }
  ctx.globalAlpha = 1;
}

// The painting comes on a flat navy ground with a ragged edge; flood-fill that ground from the
// border and make it transparent so the art can sit on smoke instead of a hard rectangle.
function keyBorder(img) {
  const c = document.createElement('canvas');
  c.width = img.width;
  c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height);
  const { width: w, height: h, data } = d;
  const near = (i) => Math.abs(data[i] - 64) + Math.abs(data[i + 1] - 78) + Math.abs(data[i + 2] - 105) < 14;
  const seen = new Uint8Array(w * h);
  const stack = [];
  for (let x = 0; x < w; x++) stack.push(x, (h - 1) * w + x);
  for (let y = 0; y < h; y++) stack.push(y * w, y * w + w - 1);
  while (stack.length) {
    const p = stack.pop();
    if (seen[p] || !near(p * 4)) continue;
    seen[p] = 1;
    data[p * 4 + 3] = 0;
    const x = p % w;
    if (x > 0) stack.push(p - 1);
    if (x < w - 1) stack.push(p + 1);
    if (p >= w) stack.push(p - w);
    if (p < w * (h - 1)) stack.push(p + w);
  }
  g.putImageData(d, 0, 0);
  return c;
}

(async () => {
  await document.fonts.load(`100px ${FONT}`);
  const art = await load('../store/art/kaiju-rampage.png');
  const c = document.getElementById('c');
  c.width = W;
  c.height = H;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, W, H);
  const lines = [{ text: 'KAIJU', weight: 1.35 }, { text: 'RAMPAGE', weight: 1 }];
  if (SHOT === 'tall' || SHOT === 'square') {
    // The painting fills the frame (cropping a little of its border); the title sits low, over the
    // burning ruins, like a monster-movie poster, on a darkening band so it reads at thumbnail size.
    const s = SHOT === 'tall' ? Math.max(W / art.width, H / art.height) : W / art.width * 1.0;
    const dw = art.width * s;
    const dh = art.height * s;
    const sy = SHOT === 'tall' ? (H - dh) / 2 : -art.height * s * 0.1;
    ctx.drawImage(art, (W - dw) / 2, sy, dw, dh);
    const px = Math.max(3, Math.round(8 * s));
    const band = ctx.createLinearGradient(0, H * 0.55, 0, H);
    band.addColorStop(0, 'rgba(14, 16, 26, 0)');
    band.addColorStop(0.55, 'rgba(14, 16, 26, 0.55)');
    band.addColorStop(1, 'rgba(14, 16, 26, 0.8)');
    ctx.fillStyle = band;
    ctx.fillRect(0, H * 0.55, W, H * 0.45);
    const bw = W * 0.8;
    const bh = SHOT === 'tall' ? H * 0.26 : H * 0.34;
    const box = { x: (W - bw) / 2, y: H - bh - H * (SHOT === 'tall' ? 0.06 : 0.07), w: bw, h: bh };
    ctx.drawImage(lettering(lines, box, px, FONT), 0, 0);
  } else if (SHOT === 'wide') {
    // The painting stands on the right, its ragged navy border melting into the background; the
    // title fills the left, among drifting pixel smoke and embers.
    const s = H / art.height;
    const dw = art.width * s;
    const ax = W - dw - W * 0.02;
    const px = Math.max(3, Math.round(8 * s));
    smoke(ctx, 0, 0, W, H, px);
    ctx.drawImage(keyBorder(art), ax, 0, dw, H);
    const box = { x: W * 0.05, y: H * 0.24, w: ax - W * 0.09, h: H * 0.52 };
    ctx.drawImage(lettering(lines, box, px, FONT), 0, 0);
  }
  window.done = true;
})();
</script>
