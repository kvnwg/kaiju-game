<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kaiju Rampage title art</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
<!-- The title screen's artwork, staged and rendered from the game's own voxel buildings and kaiju:
     a city burning at sundown seen from high above its avenue, smoke columns, streets running like
     lava, and the kaiju vast on the horizon. tools/title-art.mjs opens this page and saves the
     pictures to art/. -->
<script src="../vendor/three/three.min.js"></script>
<script src="../vendor/three/EffectComposer.js"></script>
<script src="../vendor/three/Pass.js"></script>
<script src="../vendor/three/ShaderPass.js"></script>
<script src="../vendor/three/CopyShader.js"></script>
<script src="../vendor/three/MaskPass.js"></script>
<script src="../vendor/three/RenderPass.js"></script>
<script src="../vendor/three/LuminosityHighPassShader.js"></script>
<script src="../vendor/three/UnrealBloomPass.js"></script>
</head>
<body>
<script type="module">
import { buildBuilding, BUILDING_TYPES } from '../src/buildings.js';
import { meshGrid } from '../src/mesher.js';
import { toGeometry } from '../src/actors3d.js';
import { makeVoxelMaterial } from '../src/render3d.js';
import { KAIJU_MODELS } from '../src/models.js';
import { createRng } from '../src/rng.js';
import { VoxelGrid, body, E } from '../src/voxel.js';

// ?w=&h= the picture's size; ?shot=wide|tall the framing.
const q = new URLSearchParams(location.search);
const W = Number(q.get('w')) || 1920;
const H = Number(q.get('h')) || 1080;
const tall = q.get('shot') === 'tall';
const rng = createRng(20261029);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

// ---------------------------------------------------------------- sky and haze
const HAZE = '#d8642e';
// h: where the horizon falls down the picture (0 top, 1 bottom); the haze there matches the fog.
function sky(h) {
  const c = document.createElement('canvas');
  c.width = 480;
  c.height = 270;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 270);
  g.addColorStop(0, '#1e0806');
  g.addColorStop(h * 0.4, '#4a120a');
  g.addColorStop(h * 0.72, '#a8341a');
  g.addColorStop(h * 0.9, '#ec6a2a');
  g.addColorStop(h * 0.96, '#ffa848');
  g.addColorStop(h, HAZE);
  g.addColorStop(1, HAZE);
  x.fillStyle = g;
  x.fillRect(0, 0, 480, 270);
  // The sun, low and swollen in the haze, right of centre.
  const sx = 300;
  const sy = 270 * h * 0.93;
  const glow = x.createRadialGradient(sx, sy, 0, sx, sy, 120);
  glow.addColorStop(0, 'rgba(255,246,210,1)');
  glow.addColorStop(0.08, 'rgba(255,214,130,0.9)');
  glow.addColorStop(0.35, 'rgba(255,150,60,0.35)');
  glow.addColorStop(1, 'rgba(255,120,40,0)');
  x.fillStyle = glow;
  x.fillRect(0, 0, 480, 270);
  x.fillStyle = '#fff8e0';
  x.beginPath();
  x.arc(sx, sy, 8, 0, Math.PI * 2);
  x.fill();
  // Streaks of cloud and smoke across the upper sky.
  for (let i = 0; i < 90; i++) {
    const bx = rng.next() * 480;
    const by = rng.next() * 270 * h * 0.8;
    const br = 14 + rng.next() * 40;
    const s = x.createRadialGradient(bx, by, 0, bx, by, br);
    const a = 0.15 + rng.next() * 0.35;
    s.addColorStop(0, `rgba(24,8,8,${a})`);
    s.addColorStop(1, 'rgba(24,8,8,0)');
    x.fillStyle = s;
    x.fillRect(bx - br, by - br * 0.6, br * 2, br * 1.2);
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  return t;
}
scene.fog = new THREE.Fog(HAZE, 2500, 15000);

// Backlit from the setting sun ahead; the fires below light everything else.
scene.add(new THREE.HemisphereLight(0xe0743c, 0x1a0806, 0.5));
const sun = new THREE.DirectionalLight(0xffa050, 1.1);
sun.position.set(800, 600, -9000);
scene.add(sun);

const uniforms = { uNight: { value: 0.45 } };
const voxelMat = makeVoxelMaterial(uniforms);
const kaijuMat = makeVoxelMaterial(uniforms, 0.1);

// ---------------------------------------------------------------- the city
// Downtown towers near the avenue, mid-rises further out; each type and variant meshed once.
const geoCache = new Map();
function towerGeo(id, variant) {
  const key = `${id}:${variant}`;
  if (!geoCache.has(key)) {
    const b = buildBuilding(id, variant);
    geoCache.set(key, { geo: toGeometry(meshGrid(b.grid, { v: b.dims.v, ox: b.origin.x, oz: b.origin.z })), w: b.dims.w, h: b.dims.h, height: b.dims.height });
  }
  return geoCache.get(key);
}
const towers = BUILDING_TYPES.filter((t) => t.tier === 5 && t.zones.includes('downtown') && t.weight > 0).map((t) => t.id);
const midrise = BUILDING_TYPES.filter((t) => t.tier === 4 && t.weight > 0 && (t.zones.includes('neon') || t.zones.includes('brick') || t.zones.includes('commercial'))).map((t) => t.id);

const BLOCK = 230; // a block and its street
const AVENUE = 170; // the wide avenue the camera looks down
function place(id, x, z, rot, tallness = 1) {
  const t = towerGeo(id, rng.int(0, 3));
  const m = new THREE.Mesh(t.geo, voxelMat);
  m.position.set(x, 0, z);
  m.rotation.y = rot * (Math.PI / 2);
  m.scale.y = tallness;
  scene.add(m);
  return t;
}

// The landmark: a stepped art-deco tower with a needle spire and a red light on top.
function spireTower(x, z, scale = 4) {
  const g = new VoxelGrid(30, 150, 30);
  const wall = 0x5e544c;
  const win = { w: 1, h: 2, gap: 1, sill: 1, glass: 0x241c1c, lit: [0xffc36b, 0xffa04a, 0xff8a3a], litChance: 0.3 };
  for (const [i, y0, y1] of [[0, 0, 62], [4, 62, 88], [8, 88, 104], [11, 104, 114]]) body(g, rng, { x0: i, z0: i, x1: 30 - i, z1: 30 - i, y0, y1, floorH: 3, wall, win });
  g.box(13, 114, 13, 17, 126, 17, 0x6e665e);
  g.box(14, 126, 14, 16, 140, 16, 0x8a8a92);
  g.box(15, 140, 15, 16, 149, 16, 0xa0a0a8);
  g.set(15, 149, 15, 0xff3020, E);
  const m = new THREE.Mesh(toGeometry(meshGrid(g, { v: scale, ox: 15, oz: 15 })), voxelMat);
  m.position.set(x, 0, z);
  scene.add(m);
}
spireTower(-560, -260, 4.6);
spireTower(1180, -2400, 4);
for (let row = 0; row < 46; row++) {
  const z = 600 - row * BLOCK;
  for (let col = -12; col <= 12; col++) {
    if (col === 0) continue; // the avenue
    const x = Math.sign(col) * (AVENUE / 2 + (Math.abs(col) - 0.5) * BLOCK);
    const near = Math.abs(col) <= 3 && row < 30;
    const pick = near ? (rng.chance(0.85) ? towers : midrise) : rng.chance(0.3) ? towers : midrise;
    const id = pick[Math.floor(rng.next() * pick.length)];
    if ((row === 3 || row === 4) && col === -2) continue; // room for the landmark
    // The towers lining the near avenue stand tallest.
    const tallness = Math.abs(col) <= 2 && row < 14 ? 1.3 + rng.next() * 0.6 : 1;
    place(id, x + rng.range(-12, 12), z + rng.range(-12, 12), rng.int(0, 3), tallness);
  }
}

// ---------------------------------------------------------------- streets running with fire
const fireMat = new THREE.MeshBasicMaterial({ color: 0xff6a1c, fog: true });
const emberMat = new THREE.MeshBasicMaterial({ color: 0xffc04a, fog: true });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400000, 400000).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x24100c }));
ground.position.y = -1;
scene.add(ground);
// Glowing seams down some streets and the avenue, broken into chunky voxel pieces.
function lavaLine(x0, z0, x1, z1, width) {
  const len = Math.hypot(x1 - x0, z1 - z0);
  const n = Math.ceil(len / 26);
  for (let i = 0; i < n; i++) {
    if (rng.chance(0.18)) continue;
    const t = i / n;
    const w = width * (0.5 + rng.next() * 0.8);
    const m = new THREE.Mesh(new THREE.BoxGeometry(x1 === x0 ? w : 26, 3, x1 === x0 ? 26 : w), rng.chance(0.3) ? emberMat : fireMat);
    m.position.set(x0 + (x1 - x0) * t + (x1 === x0 ? rng.range(-8, 8) : 0), 1, z0 + (z1 - z0) * t + (z1 === z0 ? rng.range(-8, 8) : 0));
    scene.add(m);
  }
}
lavaLine(0, 400, 0, -9000, 26);
for (const col of [-4, -2, 1, 3, 5]) {
  const x = Math.sign(col) * (AVENUE / 2 + Math.abs(col) * BLOCK) - Math.sign(col) * BLOCK / 2;
  lavaLine(x, 300, x, -7000, 14);
}
for (let row = 1; row < 34; row += 3) {
  const z = 600 - row * BLOCK + BLOCK / 2;
  lavaLine(-2600, z, 2600, z, 12);
}

// Fires: glowing rubble piles with a light over each.
const fires = [[-300, -900], [420, -1700], [1300, -2900], [-1500, -2300], [160, -3400], [1900, -4600], [-2100, -4400], [-200, -5200], [600, -6100]];
for (const [fx, fz] of fires) {
  for (let i = 0; i < 26; i++) {
    const s = 10 + rng.next() * 26;
    const m = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), rng.chance(0.4) ? emberMat : fireMat);
    m.position.set(fx + rng.range(-70, 70), s / 2 + rng.next() * 40, fz + rng.range(-70, 70));
    m.rotation.set(rng.next(), rng.next(), rng.next());
    scene.add(m);
  }
  const l = new THREE.PointLight(0xff6a24, 2.2, 1400, 1.6);
  l.position.set(fx, 120, fz);
  scene.add(l);
}

// ---------------------------------------------------------------- smoke columns
// Voxel smoke: dark cubes billowing up from a fire, spreading and leaning with the wind.
function smoke(x, z, height, spread, n) {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshLambertMaterial({ color: 0x2a2020, transparent: true, opacity: 0.78, depthWrite: false });
  const inst = new THREE.InstancedMesh(geo, mat, n);
  const m4 = new THREE.Matrix4();
  const quat = new THREE.Quaternion();
  const col = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const t = Math.pow(rng.next(), 0.8);
    const y = t * height;
    const r = spread * (0.15 + t * 1.1);
    const a = rng.next() * Math.PI * 2;
    const d = Math.sqrt(rng.next()) * r;
    const s = spread * (0.12 + t * 0.45) * (0.6 + rng.next() * 0.7);
    quat.setFromEuler(new THREE.Euler(rng.next() * 0.6, rng.next() * 3, rng.next() * 0.6));
    m4.compose(new THREE.Vector3(x + Math.cos(a) * d + t * t * height * 0.22, y + s / 2, z + Math.sin(a) * d - t * height * 0.05), quat, new THREE.Vector3(s, s, s));
    inst.setMatrixAt(i, m4);
    // Lit orange from the fire at its foot, sooty grey higher up.
    col.setRGB(0.22 + (1 - t) * 0.55, 0.16 + (1 - t) * 0.14, 0.14);
    inst.setColorAt(i, col);
  }
  scene.add(inst);
}
smoke(1300, -2900, 2300, 380, 700);
smoke(1900, -4600, 2000, 340, 500);
smoke(-1500, -2300, 1500, 260, 420);
smoke(-2100, -4400, 1300, 240, 300);

// ---------------------------------------------------------------- the kaiju, vast on the horizon
const model = KAIJU_MODELS.rex();
const root = new THREE.Group();
const nodes = {};
for (const p of model.parts) {
  const mesh = new THREE.Mesh(toGeometry(meshGrid(p.grid, { v: 1, ox: p.pivot.x, oy: p.pivot.y, oz: p.pivot.z })), kaijuMat);
  const g = new THREE.Group();
  g.add(mesh);
  g.position.set(p.pos.x, p.pos.y, p.pos.z);
  nodes[p.name] = g;
  (p.parent ? nodes[p.parent] : root).add(g);
}
// Roaring: head thrown back, jaw open, arms up. (The model faces +x.)
nodes.head.rotation.z = 0.35;
nodes.jaw.rotation.z = -0.55;
nodes.armL.rotation.z = 0.9;
nodes.armR.rotation.z = 0.9;
root.scale.setScalar(tall ? 115 : 110);
root.position.set(tall ? -120 : -420, 0, -6600);
root.rotation.y = -Math.PI / 2 + 0.7;
scene.add(root);
const eyeLight = new THREE.PointLight(0xffd23f, 3, 2400, 1.4);
eyeLight.position.set(root.position.x, 2300, root.position.z + 400);
scene.add(eyeLight);

// ---------------------------------------------------------------- camera and picture
const camera = new THREE.PerspectiveCamera(tall ? 62 : 44, W / H, 20, 30000);
camera.position.set(tall ? 0 : 60, tall ? 1500 : 1250, tall ? 2300 : 2100);
camera.lookAt(tall ? 0 : 60, tall ? 350 : 420, -4200);
camera.updateMatrixWorld();
const horizon = new THREE.Vector3(camera.position.x, 0, -1e6).project(camera);
scene.background = sky(Math.min(0.9, Math.max(0.1, (1 - horizon.y) / 2)));
// The grade: everything pulled toward one burning orange, deeper contrast, darker corners.
const GRADE = {
  uniforms: { tDiffuse: { value: null } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(0.3, 0.59, 0.11));
      vec3 warm = vec3(l * 1.3, l * 0.6, l * 0.3);
      vec3 col = pow(mix(c, warm, 0.5), vec3(1.12));
      float d = distance(vUv, vec2(0.5, 0.45));
      col *= 0.55 + 0.45 * smoothstep(0.85, 0.3, d);
      gl_FragColor = vec4(col, 1.0);
    }`,
};
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.85, 0.55, 0.72));
composer.addPass(new THREE.ShaderPass(GRADE));
composer.render();
window.done = true;
</script>
</body>
</html>
